---
- &default_var
  compress: &wind_compress
    quantize: &quantize_default
      error: !float .01
      mode: linear
      bits: !int 12
    predict: &predict_default
      type: Lorenzo
    encode: &encode_default
      type: full
      split: !bool false

- name: VV
  <<: *default_var
  compress:
    <<: *wind_compress
    quantize:
      error: .02
    predict: DWT
    encode:
      type: [part1, part2]
      split: !bool true
...
