---
- &CENTER {x: 1, y: 2}
- &LEFT {x: 0, y: 2}
- &BIG {r: 10}
- &SMALL {r: 1}

# All the following maps are equal:
#
- name: a         # Explicit keys
  x: 1
  y: 2
  r: 10
  label: center/big
#
- name: b          # Merge one map
  <<: *CENTER
  r: 10
  label: center/big
#
- name: c          # Merge multiple maps
  <<: *CENTER
  <<: *BIG
  label: center/big
#
- name: d          # Merge multiple maps and Override
  <<: *SMALL
  <<: *LEFT
  <<: *BIG
  x: 1
  label: center/big
...
